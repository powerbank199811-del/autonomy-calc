[project]
name = "autonomy-calc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "fastapi>=0.110", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML>=6.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["core", "reference", "matching", "catalog", "tracking", "api"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "reference", "matching", "catalog", "tracking", "api", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"] 