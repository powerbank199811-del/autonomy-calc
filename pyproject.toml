[project]
name = "autonomy-calc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
