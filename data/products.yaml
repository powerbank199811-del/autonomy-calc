# ШАБЛОН каталога. Ці 8 позицій — приклади формату, НЕ реальні товари.
# Замінити на реальний асортимент (~50 позицій) перед запуском /rozrakhunok-avtonomii.
#
# products: фізична специфікація (бренд+модель), без ціни.
# offers: ціна + продавець для product_id. Один продукт може мати кілька офферів
# (коли з'являться інші джерела — Rozetka, AliExpress).
#
# kind: powerbank | station | inverter_battery | generator
# chemistry: lifepo4 | li_ion | agm | none
# waveform: pure_sine | modified | none

products:
