# Реальные инверторы и АКБ для сборки китов "на лету" (catalog.kits).
#
# Значения power/voltage восстановлены из исходной таблицы с исправлением
# обнаруженного сдвига колонок для позиций kind=inverter (см. ADR-026):
# то, что было в peak_power_w, на самом деле continuous_power_w; то, что
# было в dc_output_power_w, на самом деле peak_power_w.
#
# peak_power_w = continuous_power_w у трёх позиций (Deye SUN-5K, Solarverse,
# LuxPower) — ЗАГЛУШКА, реального запаса на пуск нет данных. Занижает
# возможности инвертора (безопасно), не завышает. Уточнить при следующей
# сверке.

inverters:
