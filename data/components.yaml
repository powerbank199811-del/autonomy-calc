    brand: "Deye"
    model: "SUN-5K-SG03LP1-EU"  # было SG04LP1-EU — заменено на SG03 (наличие у эпицентра), 23.08.2026
    system_voltage_v: 48
    continuous_power_w: 5000
    peak_power_w: 5000  # ЗАГЛУШКА — нет данных о пусковом запасе
