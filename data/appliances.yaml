# Справочник приборов для калькулятора автономности.
# code — стабильный ключ, не менять после релиза (на него ссылаются сохранённые расчёты).
# bus: ac_230 (через розетку/інвертор) | dc_usb (заряджання від павербанка напряму)
# requires_pure_sine: True только там, где реальный риск — компресори з електронними
# платами і медтехніка. Для простих насосів з універсальним двигуном не ставимо —
# вони, як правило, толерантні до модифікованого синуса (втрата ККД, не поломка).

